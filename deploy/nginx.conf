# Reverse proxy with TLS (template). The application listens on 127.0.0.1:3000.
server {
    listen 443 ssl http2;
    server_name vms.example.org;

    ssl_certificate     /etc/ssl/certs/vms.crt;
    ssl_certificate_key /etc/ssl/private/vms.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;   # photographs are limited to 5 MB by the application

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name vms.example.org;
    return 301 https://$host$request_uri;
}
